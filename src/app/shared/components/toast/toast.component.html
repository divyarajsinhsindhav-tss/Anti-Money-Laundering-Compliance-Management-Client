@if (toast$ | async; as toast) {
  <div class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 animate-fade-in-up">
    <div
      [class]="getToastClasses(toast.type)"
      class="p-4 border-l-4 shadow-lg min-w-[320px] max-w-md flex justify-between items-start bg-white"
    >
      <div class="flex flex-col">
        <span class="font-bold text-sm" [class]="getTextClasses(toast.type)">
          {{ toast.type }}
        </span>
        <p class="text-secondary-dark mt-1 text-sm font-medium">
          {{ toast.message }}
        </p>
      </div>
      <button
        (click)="close()"
        class="ml-4 text-secondary hover:text-primary transition-colors focus:outline-none"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>
}
