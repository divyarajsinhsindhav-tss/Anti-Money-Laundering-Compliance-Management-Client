<header
  class="h-16 bg-white/80 backdrop-blur-md border-b border-secondary/10 sticky top-0 z-50 px-6 flex items-center justify-end"
>
  <!-- Right side: Actions & Profile -->
  <div class="flex items-center gap-4">
    <div class="relative">
      <div
        (click)="toggleProfile($event)"
        class="flex items-center gap-3 pl-4 border-l border-secondary/10 group cursor-pointer"
      >
        <div class="text-right hidden sm:block">
          <p class="text-sm font-semibold text-surface-dark leading-none">
            {{ userName() | humanizeRole }}
          </p>
          <p class="text-sm text-secondary">{{ authService.user()?.role | humanizeRole }}</p>
        </div>
        <div
          class="w-10 h-10 bg-gradient-to-tr from-primary to-primary-dark rounded-full flex items-center justify-center text-white font-bold border-2 border-white shadow-sm group-hover:shadow-md transition-all"
        >
          {{ userInitial() }}
        </div>
      </div>

      <!-- Profile Dropdown Menu -->
      @if (isProfileOpen()) {
        <div
          class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-secondary/10 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-200"
        >
          <div class="px-4 py-3 border-b border-secondary/5">
            <p class="text-sm font-semibold text-surface-dark">User Profile</p>
            <p class="text-sm text-gray-800 truncate">{{ authService.user()?.email }}</p>
          </div>

          <div class="py-1">
            <a
              routerLink="/profile"
              (click)="isProfileOpen.set(false)"
              class="flex items-center gap-3 px-4 py-2 text-sm text-gray-800 hover:bg-secondary/5 transition-colors"
            >
              <svg
                class="w-4 h-4 text-gray-800/40"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
              My Profile
            </a>
          </div>

          <div class="border-t border-secondary/5 pt-1">
            <button
              (click)="logout()"
              class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors font-medium text-left"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                ></path>
              </svg>
              Sign Out
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
