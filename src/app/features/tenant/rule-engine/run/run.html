<div class="p-8 max-w-[1000px] mx-auto animate-in fade-in slide-in-from-bottom-4 duration-700">
  <!-- Header -->
  <div class="flex items-center gap-6 mb-12 border-b border-secondary/10 pb-8">
    <button (click)="goBack()" class="p-3 bg-white border border-secondary/10 hover:bg-surface-light transition-all" style="border-radius: 0;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="flex items-center gap-3 mb-2">
        <h1 class="text-3xl font-bold text-surface-dark tracking-tight">Initiate Detection Cycle</h1>
      </div>
      <p class="text-secondary text-sm ml-1">Configure parameters for manual rule engine execution.</p>
    </div>
  </div>

  <div class="flex justify-center">
    <!-- Configuration Panel -->
    <div class="w-full max-w-2xl space-y-10">
      <div class="bg-white border border-secondary/10 shadow-sm p-10 space-y-10">
        <div class="flex items-start gap-4">
          <div class="w-10 h-10 bg-primary/5 text-primary flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <h3 class="text-sm font-bold text-surface-dark uppercase tracking-widest mb-1">Execution Period</h3>
            <p class="text-xs text-secondary leading-relaxed">Specify the transaction window for this detection cycle. The engine will analyze all financial activities within these dates against active scenarios.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4">
          <div class="space-y-3">
            <label class="text-[10px] font-bold text-secondary uppercase tracking-[0.2em] block">Start Date</label>
            <input type="date" [value]="fromDate()" (change)="fromDate.set($any($event.target).value)" 
                   class="w-full bg-gray-50 border border-secondary/10 px-6 py-4 text-sm focus:outline-none focus:border-primary/50 focus:bg-white transition-all font-medium" style="border-radius: 0;">
          </div>
          <div class="space-y-3">
            <label class="text-[10px] font-bold text-secondary uppercase tracking-[0.2em] block">End Date</label>
            <input type="date" [value]="toDate()" (change)="toDate.set($any($event.target).value)" 
                   class="w-full bg-gray-50 border border-secondary/10 px-6 py-4 text-sm focus:outline-none focus:border-primary/50 focus:bg-white transition-all font-medium" style="border-radius: 0;">
          </div>
        </div>

        <div class="pt-8 border-t border-secondary/5 flex justify-end">
          <button (click)="runRuleEngine()" [disabled]="isRunningJob()" 
                  class="bg-surface-dark text-white px-10 py-4 text-[11px] font-bold uppercase tracking-[0.2em] hover:bg-primary transition-all disabled:opacity-50 flex items-center gap-3" style="border-radius: 0;">
            @if (isRunningJob()) {
              <div class="w-4 h-4 border-2 border-white/20 border-t-white animate-spin"></div>
              Initiating Pipeline...
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3z"/></svg>
              Execute Engine Run
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
